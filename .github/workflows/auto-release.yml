name: Auto Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Generate version
        id: version
        run: |
          # Generate version based on date and commit
          VERSION="v$(date +'%Y.%m.%d')-${{ steps.commit.outputs.sha_short }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: |
            ## 🚀 Auto-generated release for commit ${{ github.sha }}
            
            ### 📝 Commit Message
            ${{ steps.commit.outputs.message }}
            
            ### 👤 Author
            ${{ steps.commit.outputs.author }}
            
            ### 🔗 Commit
            [`${{ steps.commit.outputs.sha_short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            
            ### 📅 Timestamp
            ${{ steps.commit.outputs.date }}
            
            ---
            *This release was automatically generated by GitHub Actions*
          draft: false
          prerelease: false